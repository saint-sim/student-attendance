<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <nav></nav>
    <main>
        <div>
            <p>Добавить студента:</p>
            <form id="add-form">
                <input type="text" name="fullName" placeholder="Введите полное имя" required>
                <input type="submit" value="Подтвердить">
            </form>
            <p id="form-error" class="error" hidden></p>
        </div>
        <div id="students"></div>
        <div>
            <input type="checkbox" id="main-checkbox" onchange="chooseAll(this.checked)" ${isAllChecked ? "checked" : ""}> 
            <button onclick="copyStudents(true)">Список присутсвующих</button>
            <button onclick="copyStudents(false)">Список отсутсвующих</button>
            <button id="save-all-btn" onclick="updateStudents()">Сохранить изменения</button>
            <button id="save-file">Сохранить в JSON</button>
        </div>
        <div class="drag-and-drop">Перетащите файл json сюда
            <input type="file" accept=".json" id="load-file" style="display: none;">
            <label for="load-file" class="load-file-label">Выбрать файл</label>
        </div>
    </main>
    <footer></footer>
    <script src="./js/app.js"></script>
</body>
</html>
